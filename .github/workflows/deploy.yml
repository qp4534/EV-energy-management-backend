name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: qp4534/ev-energy-management-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build jar
        run: ./gradlew build -x test --no-daemon

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: qp4534
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: qp4534/EV-energy-management-gitops
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: gitops

      - name: Update image tag in gitops repo
        run: |
          sed -i "s#image: ${{ env.IMAGE }}:.*#image: ${{ env.IMAGE }}:${{ github.sha }}#" gitops/apps/backend/deployment.yaml gitops/apps/backend-eks/deployment.yaml
          cd gitops
          git config user.name "backend-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "backend image -> ${{ github.sha }}" || echo "no changes"
          git push

      - name: Sync DB password secret to cluster
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no "ubuntu@$EC2_HOST" "
            export KUBECONFIG=~/.kube/config
            kubectl create secret generic db-secret -n backend \
              --from-literal=DB_PASSWORD='$DB_PASSWORD' \
              --dry-run=client -o yaml | kubectl apply -f -
          "

      - uses: azure/setup-kubectl@v4

      - name: Sync DB password secret to EKS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          aws eks update-kubeconfig --name ev-mgmt-eks --region ap-northeast-2
          kubectl create secret generic db-secret -n backend \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Verify Backend rollout
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no "ubuntu@$EC2_HOST" \
            "set -eu
             export KUBECONFIG=~/.kube/config
             kubectl apply -f https://raw.githubusercontent.com/qp4534/EV-energy-management-gitops/main/argocd/backend-application.yaml
             kubectl apply -f https://raw.githubusercontent.com/qp4534/EV-energy-management-gitops/main/argocd/backend-eks-application.yaml
             target_image='${{ env.IMAGE }}:${{ github.sha }}'
             for attempt in \$(seq 1 30); do
               deployed_image=\$(kubectl get deployment backend -n backend -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
               if [ \"\$deployed_image\" = \"\$target_image\" ]; then
                 break
               fi
               sleep 10
             done
             if [ \"\$deployed_image\" != \"\$target_image\" ]; then
               echo 'Backend deployment did not receive the requested image.'
               kubectl get deployment,pods,svc,endpoints -n backend -o wide || true
               exit 1
             fi
             if ! kubectl rollout status deployment/backend -n backend --timeout=180s; then
               kubectl get deployment,pods,svc,endpoints -n backend -o wide || true
               kubectl logs deployment/backend -n backend --tail=100 || true
               exit 1
             fi
             kubectl get deployment,pods,svc,endpoints -n backend -o wide"
