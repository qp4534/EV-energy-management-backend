name: Build and Deploy

on:
  push:
    # dev_nh added temporarily to test this workflow before merging; remove once verified
    branches: [main, dev_nh]
  workflow_dispatch:

env:
  IMAGE: qp4534/ev-energy-management-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build jar
        run: ./gradlew build -x test --no-daemon

      - uses: docker/login-action@v3
        with:
          username: qp4534
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: qp4534/EV-energy-management-gitops
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: gitops

      - name: Update image tag in gitops repo
        run: |
          sed -i "s#image: ${{ env.IMAGE }}:.*#image: ${{ env.IMAGE }}:${{ github.sha }}#" gitops/apps/backend/deployment.yaml
          cd gitops
          git config user.name "backend-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "backend image -> ${{ github.sha }}" || echo "no changes"
          git push
