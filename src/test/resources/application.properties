# Test-only infrastructure: never connect the local/CI test suite to the shared RDS.
spring.datasource.url=jdbc:h2:mem:ev_energy_management_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# A Redis server is not required to construct the MVC and application-context tests.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Keep all HTTP clients local and inert unless an individual test replaces them.
fastapi.base-url=http://localhost:8000
ai.chatbot.base-url=http://localhost:8000

jwt.secret=test-only-jwt-signing-secret-not-for-production
jwt.expiration-ms=3600000
