spring.application.name=backend

# ERD is not finalized yet - controllers currently return dummy data only, no real entities.
# Point JPA at a throwaway in-memory H2 DB so the app can boot without a real Postgres/Redis.
# Swap this for real spring.datasource.* (Postgres) once entities/migrations exist.
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none

# Security is temporarily set to permit-all in config/SecurityConfig.java until a real auth policy exists.

# Kubernetes readiness/liveness probes - independent of DB/Redis connectivity so pods
# don't get stuck NotReady when those aren't provisioned in this environment.
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
