spring.application.name=backend

# RDS PostgreSQL (ev-postgre-db, ap-northeast-2). Password comes from the DB_PASSWORD
# env var, never hardcoded here. Controllers still return mock data - no @Entity classes
# exist yet, so ddl-auto=none is safe (nothing for Hibernate to validate/generate).
spring.datasource.url=jdbc:postgresql://ev-postgre-db.czg24yks00b1.ap-northeast-2.rds.amazonaws.com:5432/ev_database
spring.datasource.username=ev_admin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none

# Security is temporarily set to permit-all in config/SecurityConfig.java until a real auth policy exists.

# Kubernetes readiness/liveness probes - independent of DB/Redis connectivity so pods
# don't get stuck NotReady when those aren't provisioned in this environment.
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
# Security is permit-all by default in config/SecurityConfig.java; /api/auth/** enforces
# real JWT authentication (signup/login are public, the rest require a Bearer token).

# JWT signing secret - should be supplied via the JWT_SECRET env var in real deployments
# (same convention as DB_PASSWORD above). The fallback below is only so local/IntelliJ runs
# work without extra setup - it must never be relied on outside local development, since
# anyone with this repo could forge tokens signed with it.
jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-do-not-use-in-production}
jwt.expiration-ms=14400000
