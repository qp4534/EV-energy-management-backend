spring.application.name=backend

# RDS PostgreSQL (ev-postgre-db, ap-northeast-2). Password comes from the DB_PASSWORD
# env var, never hardcoded here. Controllers still return mock data - no @Entity classes
# exist yet, so ddl-auto=none is safe (nothing for Hibernate to validate/generate).
spring.datasource.url=jdbc:postgresql://ev-postgre-db.czg24yks00b1.ap-northeast-2.rds.amazonaws.com:5432/ev_database
spring.datasource.username=ev_admin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.data-source-properties.ApplicationName=ev-backend
spring.jpa.hibernate.ddl-auto=none

# Security is temporarily set to permit-all in config/SecurityConfig.java until a real auth policy exists.

# TEMP placeholder: FastApiTwinClient requires this property with no default, so the app
# can't even start without it (was missing entirely, broke every local run). Not a real
# FastAPI address yet - the 3D twin feature itself will fail until this points somewhere
# real, but at least the app boots. Swap for the actual FastAPI service address once known.
fastapi.base-url=http://localhost:8000

# The combined FastAPI exposes inference and chatbot routes on the same base URL.
# Secrets/real service addresses are injected by the runtime, never committed.
ai.chatbot.base-url=${AI_CHATBOT_BASE_URL:${FASTAPI_BASE_URL:http://localhost:8000}}
ai.internal-token=${AI_INTERNAL_TOKEN:}
ai.chatbot.connect-timeout-ms=${AI_CHATBOT_CONNECT_TIMEOUT_MS:2000}
ai.chatbot.read-timeout-ms=${AI_CHATBOT_READ_TIMEOUT_MS:45000}

# Kubernetes readiness/liveness probes - independent of DB/Redis connectivity so pods
# don't get stuck NotReady when those aren't provisioned in this environment.
management.endpoint.health.probes.enabled=true
# prometheus 추가 - HPA custom metrics(Prometheus Adapter)가 스크랩할 /actuator/prometheus 노출
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name:backend}
# Security is permit-all by default in config/SecurityConfig.java; /api/auth/** enforces
# real JWT authentication (signup/login are public, the rest require a Bearer token).

# JWT signing secret - required, same convention as DB_PASSWORD above (no fallback).
# A checked-in default would let anyone with this repo forge tokens for any user/role,
# so local runs must set JWT_SECRET too (any value works locally; use a real secret in
# actual deployments).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=14400000

# Redis (로그아웃 토큰 블랙리스트용, security/TokenBlacklistService.java). 로컬은
# docker-compose.yml의 redis 서비스를 띄워서 쓰고, REDIS_HOST/REDIS_PORT env var로 덮어쓸 수 있다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# 회원가입 이메일 인증코드 발송용 Gmail SMTP. MAIL_USERNAME/MAIL_APP_PASSWORD 둘 다
# 실제 값이 없으면 채워지지 않는다(로컬 기본값 없음 - 진짜 계정 자격증명이라 하드코딩 안 함).
# MAIL_APP_PASSWORD는 일반 로그인 비밀번호가 아니라 구글 계정의 "앱 비밀번호"여야 한다
# (2단계 인증 활성화 후 발급 가능). 나중에 AWS SES로 옮길 땐 이 spring.mail.* 블록만 교체하면 되고
# service/EmailVerificationService.java의 JavaMailSender 사용부는 그대로 둘 수 있다.
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=${MAIL_USERNAME:}
# spring.mail.password=${MAIL_APP_PASSWORD:}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# AWS SES 프로덕션 액세스 요청이 거부되어(샌드박스 모드 유지) 임시로 Daum SMTP로 복귀.
# 기본값은 무제한 대기라, 포트가 방화벽 등으로 완전히 막혀있으면 요청이 무한정 걸린다 -
# 그래서 타임아웃을 짧게 잡아뒀는데(전부 5초), 다음 응답(DATA 이후 250 OK 등)이 5초 안에
# 안 오는 경우가 실제로 있어서(MailSendException: Exception reading response) 메일은
# 정상 발송됐는데도 우리 서버가 먼저 포기하고 에러를 내는 문제가 있었다. connectiontimeout/
# writetimeout(우리 쪽에서 보내는 동작)은 그대로 짧게 두고, timeout(다음 응답을 기다리는
# 시간)만 20초로 늘린다 - 포트가 진짜 막혀있으면 여전히 20초 안에는 실패로 확정된다.
spring.mail.host=smtp.daum.net
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=5000
# Daum SMTP는 From 헤더가 없는 메일을 거부해서(501 5.5.2) 명시적으로 넣어야 하고,
# 발신자 위조로 간주되지 않으려면 spring.mail.username과 반드시 같아야 한다.
mail.from-address=${MAIL_USERNAME:}

# 디지털 트윈 FastAPI 서버 주소 (client/FastApiTwinClient.java). FASTAPI_BASE_URL env var로
# 덮어쓸 수 있고, 없으면 로컬 FastAPI 기본 포트(8000)로 시도한다. 그 서버가 로컬에 없으면
# 트윈 관련 API 호출 시에만 연결 실패가 나고, 나머지 기능에는 영향 없다.
fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000}
fastapi.connect-timeout-ms=${FASTAPI_CONNECT_TIMEOUT_MS:1000}
fastapi.read-timeout-ms=${FASTAPI_READ_TIMEOUT_MS:1500}

# 배터리 진단(rul-diagnosis) FastAPI 서버 주소 (client/RulDiagnosisPdfClient.java) - 위
# 디지털 트윈 fastapi.base-url과는 다른 별도 서비스. 로컬 개발 땐 둘 다 기본 포트 8000이라
# 겹치지만(로컬에서 rul-diagnosis만 띄우고 테스트하면 됨), EKS에선 별도 Service DNS
# (rul-diagnosis.fastapi.svc.cluster.local)로 gitops에서 env var를 다르게 준다.
rul.diagnosis.base-url=${RUL_DIAGNOSIS_BASE_URL:http://localhost:8000}
rul.diagnosis.connect-timeout-ms=${RUL_DIAGNOSIS_CONNECT_TIMEOUT_MS:3000}
rul.diagnosis.read-timeout-ms=${RUL_DIAGNOSIS_READ_TIMEOUT_MS:20000}

# 프로필 이미지 업로드용 S3. 자격증명(AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY)은 AWS SDK
# DefaultCredentialsProvider가 표준 env var 이름으로 자동 인식하므로 여기 매핑 안 함 -
# 절대 하드코딩하지 말 것. 버킷/리전은 앱 고유 설정이라 프로퍼티로 둔다.
aws.s3.bucket=${AWS_S3_BUCKET:mijunge-images}
aws.region=${AWS_REGION:ap-northeast-2}

# 충전수요예측(charging-demand) FastAPI 서버 주소 (client/ChargingDemandClient.java) - 지도
# 화면 "지금 시간대 충전 수요" 배지 전용. 이 서비스는 ClusterIP라 앱이 직접 못 붙고 backend가
# 대신 호출해서 넘겨준다. EKS에선 Service DNS(charging-demand.fastapi.svc.cluster.local),
# 로컬 개발 땐 로컬에서 uvicorn으로 띄운 포트(기본 8001)를 쓴다.
charging.demand.base-url=${CHARGING_DEMAND_BASE_URL:http://localhost:8001}
charging.demand.connect-timeout-ms=${CHARGING_DEMAND_CONNECT_TIMEOUT_MS:3000}
charging.demand.read-timeout-ms=${CHARGING_DEMAND_READ_TIMEOUT_MS:5000}
